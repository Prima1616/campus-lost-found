<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Campus Lost & Found - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
    <h1 class="text-2xl font-bold text-slate-800 mb-2">Campus Lost & Found</h1>
    <p class="text-sm text-slate-500 mb-6">Log in with your Student Enrollment ID or Guard ID.</p>

    {% if error %}
      <div class="bg-red-100 text-red-700 p-3 rounded-lg text-sm mb-4">{{ error }}</div>
    {% endif %}

    <form action="/login" method="POST" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700">Enrollment ID / Guard ID</label>
        <input type="text" name="user_id" required placeholder="e.g. 240101 or GUARD01"
               class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700">Password</label>
        <input type="password" name="password" required placeholder="Enter password"
               class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg">
        Sign In
      </button>
    </form>
  </div>
</body>
</html>
